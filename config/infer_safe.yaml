# ---------------------------------------------------------------------------
# Inference config for the SAFE dataset (keyframe-flag CSV format).
#
# Per-run choices that used to live in a config file (train/frozen mode,
# output directory) are now CLI arguments to inference.py so a single
# config can be reused for both modes and any output location:
#   --mode {e2e,frozen}   --output_dir <dir>
#
# This file only needs to point at the data. Everything else (transforms,
# backbone architecture) is fixed by how the released weights were trained.
# ---------------------------------------------------------------------------

CSV_PATH: ../data/SAFE/labels/1fps/metadata.csv      # path to the SAFE-format annotations csv
VIDEO_ROOT: ../data/SAFE/images/1fps    # root folder containing one sub-folder per `vid`, each holding images named "<vid>_<frame>.jpg" (e.g. VIDEO_ROOT/<vid>/<vid>_0005.jpg)

SEED: 42
CUDA_ID: 0

# Data preprocessing (unchanged from the Endoscapes-trained model)
ENDOSCAPES_MEAN: [0.485, 0.456, 0.406]
ENDOSCAPES_STD: [0.229, 0.224, 0.225]
RESIZE: [384, 683]
CENTER_CROP: 384
BATCH_SIZE: 1   # unused: inference always runs at batch size 1

# Default weights per mode. Override either with --weights on the CLI.
WEIGHTS_E2E: 'SwinV2LSTM_e2e_raw_mc_V3_sd5_bestMAP.pt'
WEIGHTS_FROZEN: 'SwinCVS_frozen_ENDP_sd5_bestMAP.pt'

# SWINCVS MODEL PARAMS (E2E / INFERENCE are set programmatically from --mode)
MODEL:
  LSTM: True
  LSTM_PARAMS:
    NUM_LAYERS: 2
    HIDDEN_SIZE: 256
  MULTICLASSIFIER: True
  INFERENCE: True

# SWINV2 BACKBONE PARAMS
BACKBONE:
  DROP_PATH_RATE: 0.2
  DROP_RATE: 0.0
  NUM_CLASSES: 1000
  SWINV2:
    PATCH_SIZE: 4
    IN_CHANS: 3
    EMBED_DIM: 128
    DEPTHS: [ 2, 2, 18, 2 ]
    NUM_HEADS: [ 4, 8, 16, 32 ]
    WINDOW_SIZE: 24
    PRETRAINED_WINDOW_SIZES: [ 12, 12, 12, 6 ]
    MLP_RATIO: 4
    QKV_BIAS: True
    APE: False
    PATCH_NORM: True
  USE_CHECKPOINT: False
